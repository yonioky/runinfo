<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>

     crossorigin="anonymous"></script>
  <style>
    /* ── CSS 변수 ── */
    :root {
      --primary:        #ff4d6d;
      --primary-dim:    rgba(255,77,109,0.15);
      --secondary:      #4dabf7;
      --secondary-dim:  rgba(77,171,247,0.15);
      --accent:         #ffa94d;
      --bg:             #0d0d10;
      --surface:        #16161a;
      --surface2:       #1e1e24;
      --text:           #e8e8f0;
      --text-muted:     #6b6b80;
      --border:         #2a2a34;
      --radius:         10px;
    }
    [data-theme="light"] {
      --bg:             #f4f5f7;
      --surface:        #ffffff;
      --surface2:       #f0f1f3;
      --text:           #1a1a2e;
      --text-muted:     #7a7a90;
      --border:         #e0e0e8;
      --primary-dim:    rgba(255,77,109,0.10);
      --secondary-dim:  rgba(77,171,247,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background .25s, color .25s;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(12px);
    }
    .header-inner {
      max-width: 1080px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; height: 56px;
    }
    .logo { text-decoration: none; display: flex; align-items: center; }
    .logo-img {
      height: 38px; width: auto;
      filter: invert(1);   /* 다크모드: 검정→흰색 */
      transition: opacity .2s;
    }
    .logo:hover .logo-img { opacity: .75; }
    [data-theme="light"] .logo-img { filter: invert(0); } /* 라이트모드: 원본 그대로 */
    nav { display: flex; align-items: center; gap: 6px; }
    .nav-link {
      text-decoration: none; color: var(--text-muted);
      font-size: 0.88rem; font-weight: 600;
      padding: 5px 14px; border-radius: 20px; transition: all .18s; cursor: pointer;
      border: none; background: none;
    }
    .nav-link:hover, .nav-link.active { color: var(--primary); background: var(--primary-dim); }
    .theme-btn {
      padding: 5px 13px; border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface2); color: var(--text-muted);
      font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all .18s;
    }
    .theme-btn:hover { border-color: var(--primary); color: var(--primary); }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(160deg, #1a0a10 0%, #0d0d10 40%, #080d1a 100%);
      padding: 36px 20px 32px; text-align: center;
      border-bottom: 1px solid var(--border);
    }
    [data-theme="light"] .hero { background: linear-gradient(160deg, #fff0f3 0%, #f4f5f7 50%, #eef4ff 100%); }
    .hero-title {
      font-size: 3.6rem; font-weight: 900; letter-spacing: -2px;
      background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 8px; line-height: 1;
    }
    .hero-sub { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 24px; }

    /* 접수 마감 임박 */
    .deadline-section { max-width: 860px; margin: 0 auto; }
    .deadline-label {
      font-size: 0.78rem; font-weight: 700; color: var(--text-muted);
      text-align: left; margin-bottom: 10px; letter-spacing: .4px;
    }
    .deadline-cards {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    }
    .dl-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px;
      text-align: left; cursor: pointer;
      transition: border-color .15s, transform .15s;
      position: relative; overflow: hidden;
    }
    .dl-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }
    .dl-card:hover { border-color: var(--primary); transform: translateY(-2px); }
    .dl-card-name { font-size: 0.88rem; font-weight: 700; color: var(--text); margin-bottom: 6px; line-height: 1.35;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dl-card-meta { display: flex; align-items: center; justify-content: space-between; }
    .dl-card-date { font-size: 0.72rem; color: var(--text-muted); }
    .dl-card-dday {
      font-size: 0.72rem; font-weight: 800; padding: 2px 8px; border-radius: 6px;
      background: var(--primary); color: #fff;
    }
    .dl-card-dday.yellow { background: var(--accent); color: #000; }
    .dl-empty { font-size: 0.85rem; color: var(--text-muted); text-align: center; padding: 20px 0; grid-column: 1/-1; }

    @media (max-width: 600px) {
      .deadline-cards { grid-template-columns: 1fr; }
    }

    /* ── TABS ── */
    .tab-bar { background: var(--surface); border-bottom: 1px solid var(--border); }
    .tab-inner { max-width: 1080px; margin: 0 auto; display: flex; padding: 0 20px; }
    .tab-btn {
      padding: 13px 24px; font-size: 0.92rem; font-weight: 700;
      color: var(--text-muted); border: none; background: none;
      cursor: pointer; border-bottom: 2px solid transparent; transition: all .18s;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* ── FILTERS ── */
    .filters-wrap {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }
    .filters-inner {
      max-width: 1080px; margin: 0 auto; padding: 0 20px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .filter-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .filter-label {
      font-size: 0.72rem; font-weight: 700; color: var(--text-muted);
      width: 32px; flex-shrink: 0; text-transform: uppercase; letter-spacing: .5px;
    }
    .chip {
      padding: 4px 13px; border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface2); color: var(--text-muted);
      font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all .15s;
    }
    .chip:hover { border-color: var(--primary); color: var(--primary); }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .chip.region-chip.active { background: var(--secondary); border-color: var(--secondary); }
    .chip.dist-chip.active { background: var(--accent); border-color: var(--accent); color: #000; }
    .chip.month-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* 검색창 */
    .search-wrap { position: relative; display: flex; align-items: center; flex: 1; max-width: 360px; }
    .search-input {
      width: 100%; padding: 6px 32px 6px 14px;
      border: 1px solid var(--border); border-radius: 20px;
      background: var(--surface2); color: var(--text);
      font-size: 0.85rem; outline: none; transition: border-color .15s;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { border-color: var(--primary); }
    .search-clear {
      position: absolute; right: 10px;
      background: none; border: none; color: var(--text-muted);
      font-size: 0.75rem; cursor: pointer; padding: 0; line-height: 1;
    }
    .search-clear:hover { color: var(--primary); }

    /* ── CONTENT ── */
    .content { max-width: 1080px; margin: 0 auto; padding: 20px 20px 48px; }
    .content-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .result-count { font-size: 0.85rem; color: var(--text-muted); }
    .result-count strong { color: var(--primary); font-size: 1rem; }
    .toolbar { display: flex; align-items: center; gap: 8px; }
    .past-btn {
      padding: 5px 13px; border-radius: 20px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text-muted); font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all .15s;
    }
    .past-btn.on { border-color: var(--accent); color: var(--accent); }
    .sort-select {
      border: 1px solid var(--border); border-radius: 8px;
      padding: 5px 10px; font-size: 0.82rem; cursor: pointer;
      background: var(--surface2); color: var(--text); transition: background .25s;
    }

    /* ── RACE CARDS ── */
    .race-list { display: flex; flex-direction: column; gap: 8px; }
    .race-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex; align-items: stretch; overflow: hidden;
      cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s;
      position: relative;
    }
    .race-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--primary); opacity: 0; transition: opacity .15s;
      border-radius: var(--radius) 0 0 var(--radius);
    }
    .race-card:hover { border-color: var(--primary); box-shadow: 0 4px 20px rgba(255,77,109,.12); transform: translateY(-1px); }
    .race-card:hover::before { opacity: 1; }

    /* 날짜 컬럼 */
    .race-date {
      width: 80px; min-width: 80px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 12px 6px; text-align: center; gap: 1px;
      background: var(--primary-dim);
    }
    .race-date.intl { background: var(--secondary-dim); }
    .rd-month { font-size: 0.7rem; font-weight: 700; color: var(--primary); letter-spacing: .5px; }
    .rd-day   { font-size: 1.8rem; font-weight: 900; color: var(--primary); line-height: 1; }
    .rd-week  { font-size: 0.68rem; color: var(--primary); opacity: .8; }
    .race-date.intl .rd-month,
    .race-date.intl .rd-day,
    .race-date.intl .rd-week { color: var(--secondary); }

    .dday-badge {
      margin-top: 5px; font-size: 0.62rem; font-weight: 800;
      padding: 2px 6px; border-radius: 6px; display: inline-block;
    }
    .dday-today { background: var(--primary); color: #fff; }
    .dday-soon  { background: var(--primary); color: #fff; }
    .dday-mid   { background: var(--accent);  color: #000; }
    .dday-far   { background: var(--secondary); color: #fff; }
    .dday-past  { background: var(--border);  color: var(--text-muted); }

    /* 본문 */
    .race-body { flex: 1; padding: 12px 16px; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
    .race-badges { display: flex; gap: 4px; flex-wrap: wrap; }
    .badge { font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
    .b-full  { background: rgba(255,77,109,.18);  color: #ff8fa3; }
    .b-half  { background: rgba(255,169,77,.18);  color: #ffa94d; }
    .b-10k   { background: rgba(64,192,87,.18);   color: #69db7c; }
    .b-5k    { background: rgba(77,171,247,.18);  color: #74c0fc; }
    .b-ultra { background: rgba(190,75,219,.18);  color: #da77f2; }
    .b-trail { background: rgba(32,201,151,.18);  color: #38d9a9; }
    .b-other { background: rgba(134,142,150,.15); color: #adb5bd; }

    .race-name { font-size: 1rem; font-weight: 700; line-height: 1.35; color: var(--text); }
    .race-meta {
      font-size: 0.78rem; color: var(--text-muted);
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .race-meta span { display: flex; align-items: center; gap: 3px; }

    /* 오른쪽 */
    .race-right {
      display: flex; flex-direction: column;
      align-items: flex-end; justify-content: center;
      padding: 12px 16px; gap: 6px; min-width: 140px;
    }
    .status-badge {
      font-size: 0.72rem; font-weight: 700;
      padding: 4px 12px; border-radius: 20px; letter-spacing: .3px;
    }
    .s-open     { background: rgba(64,192,87,.18);  color: #69db7c;  border: 1px solid rgba(64,192,87,.3); }
    .s-upcoming { background: rgba(255,169,77,.18); color: #ffa94d;  border: 1px solid rgba(255,169,77,.3); }
    .s-closed   { background: rgba(134,142,150,.1); color: var(--text-muted); border: 1px solid var(--border); }
    .reg-period { font-size: 0.7rem; color: var(--text-muted); text-align: right; line-height: 1.6; }

    /* ── EMPTY ── */
    .empty-state { text-align: center; padding: 64px 20px; color: var(--text-muted); display: none; }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.9rem; }

    /* ── FOOTER ── */
    footer {
      background: var(--surface); border-top: 1px solid var(--border);
      text-align: center; padding: 24px 20px;
      font-size: 0.78rem; color: var(--text-muted);
    }
    footer strong { color: var(--text); }

    /* ── MOBILE ── */
    @media (max-width: 600px) {
      .hero-title { font-size: 1.4rem; }

      .race-right { display: none; }
      .race-date  { width: 68px; min-width: 68px; }
      .rd-day     { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="header-inner">
    <a class="logo" href="#">
      <img src="logo.png" alt="JOYFULRUN" class="logo-img">
    </a>
    <nav>
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">☀️ 라이트</button>
    </nav>
  </div>
</header>

<!-- ── HERO ── -->
<section class="hero">
  <div class="hero-title">JOYFULRUN</div>
  <p class="hero-sub">국내외 마라톤·러닝 대회 일정을 모아드립니다</p>
  <!-- 📢 최신정보 -->
  <div id="latest-section" style="max-width:860px;margin:0 auto 18px;display:none;">
    <div style="font-size:0.78rem;font-weight:700;color:var(--text-muted);text-align:left;margin-bottom:8px;letter-spacing:.4px;">📢 최신정보 — 접수 오픈 예정</div>
    <div id="latest-list" style="display:flex;flex-direction:column;gap:6px;"></div>
  </div>
  <!-- 접수 마감 임박 -->
  <div class="deadline-section">
    <div class="deadline-label">⏰ 접수 마감 임박</div>
    <div class="deadline-cards" id="deadline-cards"></div>
  </div>
</section>

<!-- ── TAB BAR ── -->
<div class="tab-bar">
  <div class="tab-inner">
    <button class="tab-btn active" id="tab-domestic" onclick="switchTab('domestic')">🇰🇷 국내 대회</button>
    <button class="tab-btn"        id="tab-intl"     onclick="switchTab('intl')">🌏 해외 대회</button>
  </div>
</div>

<!-- ── FILTERS ── -->
<div class="filters-wrap">
  <div class="filters-inner">
    <!-- 텍스트 검색 -->
    <div class="filter-row">
      <span class="filter-label">검색</span>
      <div class="search-wrap">
        <input id="search-input" class="search-input" type="text"
          placeholder="대회명, 지역, 주관사 검색..."
          oninput="activeSearch=this.value.trim(); renderRaces()">
        <button class="search-clear" id="search-clear" onclick="clearSearch()" style="display:none">✕</button>
      </div>
    </div>
    <!-- 월별 -->
    <div class="filter-row" id="month-filter"><span class="filter-label">월</span></div>
    <!-- 지역 -->
    <div class="filter-row" id="region-filter"><span class="filter-label">지역</span></div>
    <!-- 상태 -->
    <div class="filter-row">
      <span class="filter-label">상태</span>
      <div id="status-filter" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
    </div>
    <!-- 거리 -->
    <div class="filter-row">
      <span class="filter-label">거리</span>
      <div id="dist-filter" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
    </div>
  </div>
</div>

<!-- ── CONTENT ── -->
<div class="content">
  <div class="content-header">
    <p class="result-count"><strong id="count">0</strong>개 대회</p>
    <div class="toolbar">
      <button class="past-btn" id="past-toggle-btn" onclick="togglePast()">📅 지난 대회 포함</button>
      <select class="sort-select" id="sort-select" onchange="renderRaces()">
        <option value="date">날짜순</option>
        <option value="name">이름순</option>
      </select>
    </div>
  </div>
  <div class="race-list" id="race-list"></div>
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">🔍</div>
    <p>조건에 맞는 대회가 없습니다.</p>
  </div>
</div>


<script>
// ════════════════════════════════
//  샘플 데이터 (races.json 로드 전 fallback)
// ════════════════════════════════
const RACES = [
  { type:'domestic', date:'2026-05-17', weekday:'일', name:'2026 서울 한강 마라톤', location:'서울 | 잠실종합운동장', startTime:'07:00', distances:['풀','하프','10km'], region:'서울', status:'open', regStart:'2026-03-01', regEnd:'2026-05-10', organizer:'서울마라톤조직위', url:'#' },
  { type:'domestic', date:'2026-06-07', weekday:'일', name:'2026 경주 국제마라톤', location:'경북 | 황성공원', startTime:'07:00', distances:['풀','하프','10km','5km'], region:'영남', status:'upcoming', regStart:'2026-04-01', regEnd:'2026-05-31', organizer:'경주시체육회', url:'#' },
  { type:'intl', date:'2026-09-20', weekday:'일', name:'Berlin Marathon 2026', location:'독일 | 베를린', startTime:'09:15', distances:['풀'], region:'유럽', status:'open', regStart:'2026-01-10', regEnd:'2026-08-31', organizer:'SCC Events', url:'#' },
];

// ════════════════════════════════
//  상태
// ════════════════════════════════
let currentTab   = 'domestic';
let activeRegion = '전체';
let activeStatus = '전체';
let activeDist   = '전체';
let activeMonth  = '전체';
let activeSearch = '';
let showPast     = false;

function todayStr() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}

const DOMESTIC_REGIONS = ['전체','서울','강원','경기','영남','전라','충청','제주'];
const INTL_REGIONS     = ['전체','아시아','유럽','북미','오세아니아'];
const STATUSES         = ['전체','접수전','접수중','접수마감'];
const DISTANCES        = ['전체','풀','하프','10km','5km','울트라','트레일'];

const STATUS_KR  = { upcoming:'접수전', open:'접수중', closed:'접수마감' };
const STATUS_CLS = { open:'s-open', upcoming:'s-upcoming', closed:'s-closed' };
const DIST_CLS   = {
  '풀':'b-full','하프':'b-half','10km':'b-10k','5km':'b-5k','3km':'b-5k',
  '100km':'b-ultra','50km':'b-ultra','울트라':'b-ultra',
  '트레일':'b-trail','25km':'b-other'
};

// ════════════════════════════════
//  테마
// ════════════════════════════════
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️ 라이트' : '🌙 다크';
}
function toggleTheme() {
  const cur  = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('ri_theme', next); } catch(e) {}
}
// 저장된 테마 적용 (없으면 dark 유지)
try {
  const saved = localStorage.getItem('ri_theme');
  if (saved) applyTheme(saved);
} catch(e) {}

// ════════════════════════════════
//  D-DAY
// ════════════════════════════════
function getDday(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const race  = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff  = Math.round((race - today) / 86400000);
  if (diff < 0)   return { label: '종료',      cls: 'dday-past' };
  if (diff === 0) return { label: 'D-DAY',     cls: 'dday-today' };
  if (diff <= 30) return { label: `D-${diff}`, cls: 'dday-soon' };
  if (diff <= 90) return { label: `D-${diff}`, cls: 'dday-mid' };
  return              { label: `D-${diff}`, cls: 'dday-far' };
}

// ════════════════════════════════
//  📢 최신정보 (upcoming — 접수 오픈 예정)
// ════════════════════════════════
function renderLatest() {
  const section = document.getElementById('latest-section');
  const list    = document.getElementById('latest-list');
  if (!section || !list) return;

  const items = RACES
    .filter(r => r.status === 'upcoming')
    .sort((a, b) => (a.regStart || '9999').localeCompare(b.regStart || '9999'));

  if (!items.length) { section.style.display = 'none'; return; }

  section.style.display = '';
  list.innerHTML = items.map(r => {
    const distBadges = (r.distances || []).map(d =>
      `<span style="font-size:0.7rem;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--text-muted)">${d}</span>`
    ).join(' ');
    const regLabel = r.regStart ? `접수 ${r.regStart} 오픈 예정` : '접수일 미정';
    const noticeHtml = r.notice ? `<span style="font-size:0.72rem;color:var(--text-muted);font-style:italic;margin-left:8px">※ ${r.notice}</span>` : '';
    return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer" onclick="window.open('https://search.naver.com/search.naver?query=${encodeURIComponent(r.name)}','_blank')">
      <span style="font-size:0.7rem;font-weight:700;background:rgba(255,169,77,.18);color:#ffa94d;border:1px solid rgba(255,169,77,.3);border-radius:5px;padding:2px 7px">NEW</span>
      <span style="font-size:0.88rem;font-weight:700;color:var(--text)">${r.name}</span>
      <span style="font-size:0.75rem;color:var(--text-muted)">${r.date || '날짜미정'}</span>
      <span>${distBadges}</span>
      <span style="font-size:0.72rem;color:var(--primary);margin-left:auto">${regLabel}</span>
      ${noticeHtml}
    </div>`;
  }).join('');
}

// ════════════════════════════════
//  접수 마감 임박 (상위 3개)
// ════════════════════════════════
function updateStats() {
  renderLatest();
  renderDeadlines();
}

function renderDeadlines() {
  const today = todayStr();
  const container = document.getElementById('deadline-cards');
  if (!container) return;

  // 접수중(open)이면서 마감일이 있고 오늘 이후인 것만, 마감 가까운 순 정렬
  const candidates = RACES
    .filter(r => r.status === 'open' && r.regEnd && r.regEnd >= today && r.date >= today)
    .sort((a, b) => a.regEnd.localeCompare(b.regEnd))
    .slice(0, 3);

  if (!candidates.length) {
    container.innerHTML = '<div class="dl-empty">현재 접수 마감 임박 대회가 없습니다.</div>';
    return;
  }

  container.innerHTML = candidates.map(r => {
    const [y, m, d] = r.regEnd.split('-').map(Number);
    const end   = new Date(y, m - 1, d);
    const now   = new Date(); now.setHours(0,0,0,0);
    const diff  = Math.round((end - now) / 86400000);
    const label = diff === 0 ? 'D-DAY' : `D-${diff}`;
    const cls   = diff <= 7 ? '' : 'yellow';
    const naverUrl = `https://search.naver.com/search.naver?query=${encodeURIComponent(r.name)}`;
    return `
      <div class="dl-card" onclick="window.open('${naverUrl}','_blank')">
        <div class="dl-card-name">${r.name}</div>
        <div class="dl-card-meta">
          <span class="dl-card-date">마감 ${r.regEnd}</span>
          <span class="dl-card-dday ${cls}">${label}</span>
        </div>
      </div>`;
  }).join('');
}

// ════════════════════════════════
//  네비 활성화
// ════════════════════════════════
function setNavActive(el) {
  document.querySelectorAll('.nav-link').forEach(a => a.classList.remove('active'));
  el.classList.add('active');
}

// ════════════════════════════════
//  탭 전환
// ════════════════════════════════
function switchTab(tab) {
  currentTab = tab;
  activeRegion = activeStatus = activeDist = activeMonth = '전체';
  activeSearch = '';
  showPast = false;
  const si = document.getElementById('search-input');
  if (si) { si.value = ''; }
  document.getElementById('search-clear').style.display = 'none';
  const btn = document.getElementById('past-toggle-btn');
  if (btn) { btn.classList.remove('on'); btn.textContent = '📅 지난 대회 포함'; }
  document.getElementById('tab-domestic').classList.toggle('active', tab === 'domestic');
  document.getElementById('tab-intl').classList.toggle('active', tab === 'intl');
  buildFilters();
  renderRaces();
}

function clearSearch() {
  activeSearch = '';
  const si = document.getElementById('search-input');
  if (si) si.value = '';
  document.getElementById('search-clear').style.display = 'none';
  renderRaces();
}

// ════════════════════════════════
//  지난 대회 토글
// ════════════════════════════════
function togglePast() {
  showPast = !showPast;
  activeMonth = '전체';  // 지난 대회 토글 시 월 필터 리셋
  const btn = document.getElementById('past-toggle-btn');
  btn.classList.toggle('on', showPast);
  btn.textContent = showPast ? '📅 지난 대회 숨기기' : '📅 지난 대회 포함';
  buildMonth();
  renderRaces();
}

// ════════════════════════════════
//  필터 빌드
// ════════════════════════════════
function buildFilters() { buildMonth(); buildRegion(); buildStatus(); buildDist(); }

function buildMonth() {
  const wrap = document.getElementById('month-filter');
  const label = wrap.querySelector('.filter-label');
  wrap.innerHTML = ''; wrap.appendChild(label);
  // 데이터에 실제 존재하는 월만 표시
  const today = todayStr();
  const base  = RACES.filter(r => r.type === currentTab && (showPast || r.date >= today));
  const months = [...new Set(base.map(r => r.date.slice(0,7)))].sort();
  const labels = ['전체', ...months.map(m => {
    const [y, mo] = m.split('-');
    return `${y}.${mo}`;
  })];
  const values = ['전체', ...months];
  labels.forEach((label2, i) => {
    const b = document.createElement('button');
    b.className = 'chip month-chip' + (values[i] === activeMonth ? ' active' : '');
    b.textContent = label2;
    b.onclick = () => { activeMonth = values[i]; buildMonth(); renderRaces(); };
    wrap.appendChild(b);
  });
}
function buildRegion() {
  const list = currentTab === 'domestic' ? DOMESTIC_REGIONS : INTL_REGIONS;
  const wrap = document.getElementById('region-filter');
  const label = wrap.querySelector('.filter-label');
  wrap.innerHTML = ''; wrap.appendChild(label);
  list.forEach(r => {
    const b = document.createElement('button');
    b.className = 'chip region-chip' + (r === activeRegion ? ' active' : '');
    b.textContent = r;
    b.onclick = () => { activeRegion = r; buildRegion(); renderRaces(); };
    wrap.appendChild(b);
  });
}
function buildStatus() {
  const wrap = document.getElementById('status-filter'); wrap.innerHTML = '';
  STATUSES.forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip' + (s === activeStatus ? ' active' : '');
    b.textContent = s;
    b.onclick = () => { activeStatus = s; buildStatus(); renderRaces(); };
    wrap.appendChild(b);
  });
}
function buildDist() {
  const wrap = document.getElementById('dist-filter'); wrap.innerHTML = '';
  DISTANCES.forEach(d => {
    const b = document.createElement('button');
    b.className = 'chip dist-chip' + (d === activeDist ? ' active' : '');
    b.textContent = d;
    b.onclick = () => { activeDist = d; buildDist(); renderRaces(); };
    wrap.appendChild(b);
  });
}

// ════════════════════════════════
//  렌더
// ════════════════════════════════
function renderRaces() {
  const today = todayStr();
  let list = RACES.filter(r => r.type === currentTab);
  if (!showPast) list = list.filter(r => r.date >= today);
  if (activeMonth  !== '전체') list = list.filter(r => r.date.slice(0,7) === activeMonth);
  if (activeRegion !== '전체') list = list.filter(r => r.region === activeRegion);
  if (activeStatus !== '전체') list = list.filter(r => STATUS_KR[r.status] === activeStatus);
  if (activeDist   !== '전체') {
    list = list.filter(r => r.distances.some(d => {
      if (activeDist === '울트라') return ['100km','50km','울트라'].includes(d);
      return d === activeDist;
    }));
  }
  // 텍스트 검색 (대회명 + 장소 + 주관사)
  if (activeSearch) {
    const kw = activeSearch.toLowerCase();
    list = list.filter(r =>
      (r.name      || '').toLowerCase().includes(kw) ||
      (r.location  || '').toLowerCase().includes(kw) ||
      (r.organizer || '').toLowerCase().includes(kw)
    );
    document.getElementById('search-clear').style.display = '';
  } else {
    document.getElementById('search-clear').style.display = 'none';
  }
  const sort = document.getElementById('sort-select').value;
  list.sort((a, b) => sort === 'date' ? a.date.localeCompare(b.date) : a.name.localeCompare(b.name));

  document.getElementById('count').textContent = list.length;
  const container = document.getElementById('race-list');
  const empty     = document.getElementById('empty-state');
  if (!list.length) { container.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  container.innerHTML = list.map(r => {
    const [y, mo, d] = r.date.split('-').map(Number);
    const isIntl = r.type === 'intl';
    const dday   = getDday(r.date);
    const badges = r.distances.map(d2 =>
      `<span class="badge ${DIST_CLS[d2] || 'b-other'}">${d2}</span>`
    ).join('');
    const naverUrl = `https://search.naver.com/search.naver?query=${encodeURIComponent(r.name)}`;

    return `
      <div class="race-card" onclick="window.open('${naverUrl}','_blank')">
        <div class="race-date${isIntl ? ' intl' : ''}">
          <span class="rd-month">${mo}월</span>
          <span class="rd-day">${d}</span>
          <span class="rd-week">(${r.weekday})</span>
          <span class="dday-badge ${dday.cls}">${dday.label}</span>
        </div>
        <div class="race-body">
          <div class="race-badges">${badges}</div>
          <div class="race-name">${r.name}</div>
          <div class="race-meta">
            <span>${isIntl ? '🌏' : '📍'} ${r.location}</span>
            ${r.startTime ? `<span>⏰ ${r.startTime}</span>` : ''}
          </div>
        </div>
        <div class="race-right">
          <span class="status-badge ${STATUS_CLS[r.status]}">${STATUS_KR[r.status]}</span>
          <div class="reg-period">${r.regStart ? `접수 ${r.regStart}<br>~ ${r.regEnd}` : ''}</div>
        </div>
      </div>`;
  }).join('');
}

// ════════════════════════════════
//  부트스트랩
// ════════════════════════════════
(async function boot() {
  document.getElementById('race-list').innerHTML =
    '<div style="text-align:center;padding:48px;color:var(--text-muted)">⏳ 불러오는 중...</div>';
  try {
    const res = await fetch('races.json?v=' + Date.now());
    if (!res.ok) throw new Error('races.json ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) throw new Error('빈 데이터');
    RACES.length = 0;
    data.forEach(r => RACES.push(r));
    console.log('[JOYFULRUN] 로드 완료:', data.length, '건');
  } catch(e) {
    console.warn('[JOYFULRUN] races.json 실패 → 샘플 데이터:', e.message);
  }
  updateStats();
  buildFilters();
  renderRaces();
})();
</script>
