<html lang="ko">

  <style>
    :root {
      --primary: #e84057;
      --primary-dark: #c42d42;
      --primary-light: #ffeaed;
      --secondary: #3b5bdb;
      --secondary-light: #edf2ff;
      --accent: #ff922b;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #212529;
      --text-muted: #868e96;
      --border: #dee2e6;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --shadow-hover: 0 6px 24px rgba(0,0,0,0.13);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', -apple-system, 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ── HEADER ── */
    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 60px;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    nav {
      display: flex;
      gap: 4px;
    }
    nav a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 20px;
      transition: all .2s;
    }
    nav a:hover, nav a.active {
      color: var(--primary);
      background: var(--primary-light);
    }
    .header-btn {
      background: var(--primary);
      color: #fff !important;
      border-radius: 20px;
      padding: 6px 16px;
    }
    .header-btn:hover {
      background: var(--primary-dark) !important;
      color: #fff !important;
    }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(135deg, var(--primary) 0%, #ff6b8a 60%, var(--accent) 100%);
      color: #fff;
      text-align: center;
      padding: 52px 20px 44px;
    }
    .hero h1 { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
    .hero p { font-size: 1rem; opacity: .88; }
    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 24px;
    }
    .hero-stat { text-align: center; }
    .hero-stat strong { display: block; font-size: 1.6rem; font-weight: 800; }
    .hero-stat span { font-size: 0.78rem; opacity: .85; }

    /* ── TAB BAR ── */
    .tab-bar {
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .tab-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      padding: 0 20px;
    }
    .tab-btn {
      padding: 14px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: none;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all .2s;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* ── FILTERS ── */
    .filters-wrap {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
    }
    .filters-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      width: 36px;
      flex-shrink: 0;
    }
    .chip {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .18s;
      color: var(--text);
    }
    .chip:hover { border-color: var(--primary); color: var(--primary); }
    .chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .chip.region-chip.active {
      background: var(--secondary);
      border-color: var(--secondary);
    }
    .chip.dist-chip.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* ── MAIN CONTENT ── */
    .content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px;
    }
    .content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .result-count {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .result-count strong { color: var(--primary); }
    .sort-select {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      background: #fff;
    }

    /* ── RACE CARDS ── */
    .race-list { display: flex; flex-direction: column; gap: 12px; }

    .race-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      align-items: stretch;
      overflow: hidden;
      transition: all .2s;
      cursor: pointer;
    }
    .race-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
      border-color: #ccc;
    }

    .race-date {
      width: 88px;
      min-width: 88px;
      background: var(--primary-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 8px;
      text-align: center;
    }
    .race-date .month { font-size: 0.78rem; font-weight: 600; color: var(--primary); }
    .race-date .day { font-size: 2rem; font-weight: 800; color: var(--primary); line-height: 1; }
    .race-date .weekday { font-size: 0.72rem; color: var(--primary); margin-top: 2px; }
    .race-date.intl { background: var(--secondary-light); }
    .race-date.intl .month,
    .race-date.intl .day,
    .race-date.intl .weekday { color: var(--secondary); }

    .race-body {
      flex: 1;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .race-badges {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 10px;
    }
    .badge-full { background: #ffe3e3; color: #c92a2a; }
    .badge-half { background: #fff3bf; color: #e67700; }
    .badge-10k  { background: #d3f9d8; color: #2f9e44; }
    .badge-5k   { background: #e8f4fd; color: #1971c2; }
    .badge-ultra{ background: #f3d9fa; color: #7950f2; }
    .badge-trail{ background: #fff0f6; color: #c2255c; }

    .race-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .race-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .race-meta span { display: flex; align-items: center; gap: 3px; }

    .race-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      padding: 14px 16px;
      gap: 8px;
      min-width: 160px;
    }
    .status-badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
    }
    .status-open { background: #d3f9d8; color: #2f9e44; }
    .status-closed { background: #f1f3f5; color: #868e96; }
    .status-upcoming { background: #fff3bf; color: #e67700; }
    .reg-period {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: right;
      line-height: 1.4;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 64px 20px;
      color: var(--text-muted);
      display: none;
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

    /* ── FOOTER ── */
    footer {
      background: #2b2d42;
      color: rgba(255,255,255,.6);
      text-align: center;
      padding: 28px 20px;
      margin-top: 48px;
      font-size: 0.82rem;
    }
    footer strong { color: #fff; }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .hero h1 { font-size: 1.5rem; }
      .hero-stats { gap: 20px; }
      .race-right { display: none; }
      .race-date { width: 72px; min-width: 72px; }
    }
  </style>
</head>

const DOMESTIC_REGIONS = ['전체','서울','경기','충청','영남','전라','제주','강원'];
const INTL_REGIONS     = ['전체','아시아','유럽','북미','오세아니아'];
const STATUSES  = ['전체','접수전','접수중','접수마감'];
const DISTANCES = ['전체','풀','하프','10km','5km','울트라'];

const STATUS_MAP = { upcoming:'접수전', open:'접수중', closed:'접수마감' };
const STATUS_CLASS = { open:'status-open', closed:'status-closed', upcoming:'status-upcoming' };
const STATUS_LABEL = { open:'접수중', closed:'접수마감', upcoming:'접수전' };

// Badge mapping
const DIST_BADGE = {
  '풀':'badge-full', '하프':'badge-half', '10km':'badge-10k',
  '5km':'badge-5k', '100km':'badge-ultra','50km':'badge-ultra',
  '50K':'badge-ultra','37K':'badge-trail','24K':'badge-trail','12K':'badge-trail',
};

// ─────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────
function init() {
  updateStats();
  buildFilters();
  renderRaces();
}

function updateStats() {
  const domestic = RACES.filter(r => r.type === 'domestic').length;
  const intl     = RACES.filter(r => r.type === 'intl').length;
  const openCnt  = RACES.filter(r => r.status === 'open').length;
  animateCount('stat-domestic', domestic);
  animateCount('stat-intl', intl);
  animateCount('stat-open', openCnt);
}

function animateCount(id, target) {
  let cur = 0;
  const el = document.getElementById(id);
  const step = Math.ceil(target / 20);
  const iv = setInterval(() => {
    cur = Math.min(cur + step, target);
    el.textContent = cur;
    if (cur >= target) clearInterval(iv);
  }, 40);
}

// ─────────────────────────────────────────
//  FILTERS
// ─────────────────────────────────────────
function buildFilters() {
  buildRegionFilter();
  buildStatusFilter();
  buildDistFilter();
}

function buildRegionFilter() {
  const regions = currentTab === 'domestic' ? DOMESTIC_REGIONS : INTL_REGIONS;
  const wrap = document.getElementById('region-filter');
  const label = wrap.querySelector('.filter-label');
  wrap.innerHTML = '';
  wrap.appendChild(label);
  regions.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'chip region-chip' + (r === activeRegion ? ' active' : '');
    btn.textContent = r;
    btn.onclick = () => { activeRegion = r; buildRegionFilter(); renderRaces(); };
    wrap.appendChild(btn);
  });
}

function buildStatusFilter() {
  const wrap = document.getElementById('status-filter');
  wrap.innerHTML = '';
  STATUSES.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (s === activeStatus ? ' active' : '');
    btn.textContent = s;
    btn.onclick = () => { activeStatus = s; buildStatusFilter(); renderRaces(); };
    wrap.appendChild(btn);
  });
}

function buildDistFilter() {
  const wrap = document.getElementById('dist-filter');
  wrap.innerHTML = '';
  DISTANCES.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'chip dist-chip' + (d === activeDist ? ' active' : '');
    btn.textContent = d;
    btn.onclick = () => { activeDist = d; buildDistFilter(); renderRaces(); };
    wrap.appendChild(btn);
  });
}

// ─────────────────────────────────────────
//  SWITCH TAB
// ─────────────────────────────────────────
function switchTab(tab, el) {
  currentTab = tab;
  activeRegion = '전체';
  activeStatus = '전체';
  activeDist = '전체';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  if (el) el.classList.add('active');
  buildFilters();
  renderRaces();
}

// ─────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────
function renderRaces() {
  let races = RACES.filter(r => r.type === currentTab);

  if (activeRegion !== '전체') races = races.filter(r => r.region === activeRegion);
  if (activeStatus !== '전체') races = races.filter(r => STATUS_MAP[r.status] === activeStatus);
  if (activeDist !== '전체') {
    races = races.filter(r => r.distances.some(d => {
      if (activeDist === '울트라') return ['100km','50km','50K','37K','24K','12K'].includes(d);
      return d === activeDist;
    }));
  }

  const sort = document.getElementById('sort-select').value;
  if (sort === 'date') races.sort((a,b) => a.date.localeCompare(b.date));
  else races.sort((a,b) => a.name.localeCompare(b.name));

  const list = document.getElementById('race-list');
  const empty = document.getElementById('empty-state');
  document.getElementById('count').textContent = races.length;

  if (races.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = races.map(r => {
    const dateObj = new Date(r.date);
    const month = dateObj.getMonth() + 1;
    const day   = dateObj.getDate();
    const isIntl = r.type === 'intl';

    const badges = r.distances.map(d =>
      `<span class="badge ${DIST_BADGE[d] || 'badge-10k'}">${d}</span>`
    ).join('');

    const flagEmoji = isIntl ? '🌏 ' : '📍 ';

    return `
      <div class="race-card" onclick="window.open('${r.url}','_blank')">
        <div class="race-date${isIntl ? ' intl' : ''}">
          <span class="month">${month}월</span>
          <span class="day">${day}일</span>
          <span class="weekday">(${r.weekday})</span>
        </div>
        <div class="race-body">
          <div class="race-badges">${badges}</div>
          <div class="race-name">${r.name}</div>
          <div class="race-meta">
            <span>${flagEmoji}${r.location}</span>
            <span>⏰ ${r.startTime} 출발</span>
          </div>
        </div>
        <div class="race-right">
          <span class="status-badge ${STATUS_CLASS[r.status]}">${STATUS_LABEL[r.status]}</span>
          <div class="reg-period">
            접수 ${r.regStart}<br>~ ${r.regEnd}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ─────────────────────────────────────────
//  LOADING STATE
// ─────────────────────────────────────────
function showLoading(on) {
  const list = document.getElementById('race-list');
  if (on) {
    list.innerHTML = `
      <div style="text-align:center;padding:48px 20px;color:var(--text-muted);">
        <div style="font-size:2rem;margin-bottom:12px;">⏳</div>
        <p>대회 정보를 불러오는 중...</p>
      </div>`;
  }
}

// ─────────────────────────────────────────
//  GO — races.json 로드 후 init
// ─────────────────────────────────────────
(async function bootstrap() {
  showLoading(true);
  try {
    const res = await fetch('races.json');
    if (!res.ok) throw new Error('races.json 없음 — 샘플 데이터 사용');
    const data = await res.json();
    // 기존 RACES 배열을 덮어씀
    RACES.length = 0;
    data.forEach(r => RACES.push(r));
    console.log(`✅ races.json 로드 완료 (${data.length}건)`);
  } catch (e) {
    console.warn(e.message);
    console.log('📋 내장 샘플 데이터 사용 중');
  }
  init();
})();
</script>
</body>
</html>
