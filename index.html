    header {
      background: var(--surface);

    .race-list { display: flex; flex-direction: column; gap: 9px; }

      background: var(--surface); border: 1px solid var(--border);

    .race-body { flex: 1; padding: 13px 16px; display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0; }

    .badge {

    .badge.b-full { background: var(--primary-dim); color: var(--primary); border-color: transparent; }

  </style>
</head>

<script>

  { type:'domestic', date:'2026-06-07', weekday:'일', name:'2026 경주 국제마라톤', location:'경북 | 황성공원', startTime:'07:00', distances:['풀','하프','10km','5km'], region:'영남', status:'upcoming', regStart:'2026-04-01', regEnd:'2026-05-31', organizer:'경주시체육회', url:'#' },
  { type:'intl', date:'2026-09-20', weekday:'일', name:'Berlin Marathon 2026', location:'독일 | 베를린', startTime:'09:15', distances:['풀'], region:'유럽', status:'open', regStart:'2026-01-10', regEnd:'2026-08-31', organizer:'SCC Events', url:'#' },
];

// ════════════════════════════════
//  상태
// ════════════════════════════════
let currentTab   = 'domestic';
let activeRegion = '전체';
let activeStatus = '전체';
let activeDist   = '전체';
let activeMonth  = '전체';
let activeSearch = '';
let showPast     = false;

function todayStr() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}

const DOMESTIC_REGIONS = ['전체','서울','강원','경기','영남','전라','충청','제주'];
const INTL_REGIONS     = ['전체','아시아','유럽','북미','오세아니아'];
const STATUSES         = ['전체','접수전','접수중','접수마감'];
const DISTANCES        = ['전체','풀','하프','10km','5km','울트라','트레일'];

const STATUS_KR  = { upcoming:'접수전', open:'접수중', closed:'접수마감' };
const STATUS_CLS = { open:'s-open', upcoming:'s-upcoming', closed:'s-closed' };
const DIST_CLS   = {
  '풀':'b-full','하프':'b-half','10km':'b-10k','5km':'b-5k','3km':'b-5k',
  '100km':'b-ultra','50km':'b-ultra','울트라':'b-ultra',
  '트레일':'b-trail','25km':'b-other'
};

// ════════════════════════════════
//  테마
// ════════════════════════════════
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const cur  = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('ri_theme', next); } catch(e) {}
}
// 저장된 테마 적용 (없으면 dark 유지)
try {
  const saved = localStorage.getItem('ri_theme');
  if (saved) applyTheme(saved);
} catch(e) {}

// ════════════════════════════════
//  D-DAY
// ════════════════════════════════
function getDday(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const race  = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff  = Math.round((race - today) / 86400000);
  if (diff < 0)   return { label: '종료',      cls: 'dday-past' };
  if (diff === 0) return { label: 'D-DAY',     cls: 'dday-today' };
  if (diff <= 30) return { label: `D-${diff}`, cls: 'dday-soon' };
  if (diff <= 90) return { label: `D-${diff}`, cls: 'dday-mid' };
  return              { label: `D-${diff}`, cls: 'dday-far' };
}

// ════════════════════════════════
//  최신정보 (upcoming — 접수 오픈 예정)
// ════════════════════════════════
function renderLatest() {
  const section = document.getElementById('latest-section');
  const list    = document.getElementById('latest-list');
  if (!section || !list) return;

  const items = RACES
    .filter(r => r.latestInfo === true && (!r.regStart || r.regStart > todayStr()))
    .sort((a, b) => (a.regStart || '9999').localeCompare(b.regStart || '9999'));

  if (!items.length) { section.style.display = 'none'; return; }

  section.style.display = '';
  list.innerHTML = items.map(r => {
    const distBadges = (r.distances || []).map(d =>
      `<span style="font-size:0.7rem;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--text-muted)">${d}</span>`
    ).join(' ');
    const regLabel = r.regStart ? `접수 ${r.regStart} 오픈 예정` : '접수일 미정';
    const noticeHtml = r.notice ? `<span style="font-size:0.72rem;color:var(--text-muted);font-style:italic;margin-left:8px">※ ${r.notice}</span>` : '';
    return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer" onclick="window.open('https://search.naver.com/search.naver?query=${encodeURIComponent(r.name)}','_blank')">
      <span style="font-size:0.68rem;font-weight:800;letter-spacing:.04em;background:var(--primary-dim);color:var(--primary);border-radius:5px;padding:2px 7px">NEW</span>
      <span style="font-size:0.88rem;font-weight:700;color:var(--text)">${r.name}</span>
      <span style="font-size:0.75rem;color:var(--text-muted)">${r.date || '날짜미정'}</span>
      <span>${distBadges}</span>
      <span style="font-size:0.72rem;color:var(--primary);margin-left:auto">${regLabel}</span>
      ${noticeHtml}
    </div>`;
  }).join('');
}

// ════════════════════════════════
//  접수 마감 임박 (상위 3개)
// ════════════════════════════════
function updateStats() {
  renderLatest();
  renderDeadlines();
}

function renderDeadlines() {
  const today = todayStr();
  const container = document.getElementById('deadline-cards');
  if (!container) return;

  // 접수중(open)이면서 마감일이 있고 오늘 이후인 것만, 마감 가까운 순 정렬
  const candidates = RACES
    .filter(r => r.status === 'open' && r.regEnd && r.regEnd >= today && r.date >= today)
    .sort((a, b) => a.regEnd.localeCompare(b.regEnd))
    .slice(0, 3);

  if (!candidates.length) {
    container.innerHTML = '<div class="dl-empty">현재 접수 마감 임박 대회가 없습니다.</div>';
    return;
  }

  container.innerHTML = candidates.map(r => {
    const [y, m, d] = r.regEnd.split('-').map(Number);
    const end   = new Date(y, m - 1, d);
    const now   = new Date(); now.setHours(0,0,0,0);
    const diff  = Math.round((end - now) / 86400000);
    const label = diff === 0 ? 'D-DAY' : `D-${diff}`;
    const cls   = diff <= 7 ? '' : 'yellow';
    const naverUrl = `https://search.naver.com/search.naver?query=${encodeURIComponent(r.name)}`;
    return `
      <div class="dl-card" onclick="window.open('${naverUrl}','_blank')">
        <div class="dl-card-name">${r.name}</div>
        <div class="dl-card-meta">
          <span class="dl-card-date">마감 ${r.regEnd}</span>
          <span class="dl-card-dday ${cls}">${label}</span>
        </div>
      </div>`;
  }).join('');
}

// ════════════════════════════════
//  네비 활성화
// ════════════════════════════════
function setNavActive(el) {
  document.querySelectorAll('.nav-link').forEach(a => a.classList.remove('active'));
  el.classList.add('active');
}

// ════════════════════════════════
//  탭 전환
// ════════════════════════════════
function switchTab(tab) {
  // 탭 버튼 상태
  document.getElementById('tab-domestic').classList.toggle('active', tab === 'domestic');
  document.getElementById('tab-intl').classList.toggle('active',     tab === 'intl');

  currentTab = tab;
  activeRegion = activeStatus = activeDist = activeMonth = '전체';
  activeSearch = '';
  showPast = false;
  const si = document.getElementById('search-input');
  if (si) { si.value = ''; }
  document.getElementById('search-clear').style.display = 'none';
  const btn = document.getElementById('past-toggle-btn');
  if (btn) { btn.classList.remove('on'); btn.textContent = '지난 대회 포함'; }
  buildFilters();
  renderRaces();
}

function clearSearch() {
  activeSearch = '';
  const si = document.getElementById('search-input');
  if (si) si.value = '';
  document.getElementById('search-clear').style.display = 'none';
  renderRaces();
}

// ════════════════════════════════
//  지난 대회 토글
// ════════════════════════════════
function togglePast() {
  showPast = !showPast;
  activeMonth = '전체';  // 지난 대회 토글 시 월 필터 리셋
  const btn = document.getElementById('past-toggle-btn');
  btn.classList.toggle('on', showPast);
  btn.textContent = showPast ? '지난 대회 숨기기' : '지난 대회 포함';
  buildMonth();
  renderRaces();
}

// ════════════════════════════════
//  필터 빌드
// ════════════════════════════════
function buildFilters() { buildMonth(); buildRegion(); buildStatus(); buildDist(); }

function buildMonth() {
  const wrap = document.getElementById('month-filter');
  const label = wrap.querySelector('.filter-label');
  wrap.innerHTML = ''; wrap.appendChild(label);
  // 데이터에 실제 존재하는 월만 표시
  const today = todayStr();
  const base  = RACES.filter(r => r.type === currentTab && (showPast || r.date >= today));
  const months = [...new Set(base.map(r => r.date.slice(0,7)))].sort();
  const labels = ['전체', ...months.map(m => {
    const [y, mo] = m.split('-');
    return `${y}.${mo}`;
  })];
  const values = ['전체', ...months];
  labels.forEach((label2, i) => {
    const b = document.createElement('button');
    b.className = 'chip month-chip' + (values[i] === activeMonth ? ' active' : '');
    b.textContent = label2;
    b.onclick = () => { activeMonth = values[i]; buildMonth(); renderRaces(); };
    wrap.appendChild(b);
  });
}
function buildRegion() {
  const list = currentTab === 'domestic' ? DOMESTIC_REGIONS : INTL_REGIONS;
  const wrap = document.getElementById('region-filter');
  const label = wrap.querySelector('.filter-label');
  wrap.innerHTML = ''; wrap.appendChild(label);
  list.forEach(r => {
    const b = document.createElement('button');
    b.className = 'chip region-chip' + (r === activeRegion ? ' active' : '');
    b.textContent = r;
    b.onclick = () => { activeRegion = r; buildRegion(); renderRaces(); };
    wrap.appendChild(b);
  });
}
function buildStatus() {
  const wrap = document.getElementById('status-filter'); wrap.innerHTML = '';
  STATUSES.forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip' + (s === activeStatus ? ' active' : '');
    b.textContent = s;
    b.onclick = () => { activeStatus = s; buildStatus(); renderRaces(); };
    wrap.appendChild(b);
  });
}
function buildDist() {
  const wrap = document.getElementById('dist-filter'); wrap.innerHTML = '';
  DISTANCES.forEach(d => {
    const b = document.createElement('button');
    b.className = 'chip dist-chip' + (d === activeDist ? ' active' : '');
    b.textContent = d;
    b.onclick = () => { activeDist = d; buildDist(); renderRaces(); };
    wrap.appendChild(b);
  });
}

// ════════════════════════════════
//  렌더
// ════════════════════════════════
function renderRaces() {
  const today = todayStr();
  let list = RACES.filter(r => r.type === currentTab);
  if (!showPast) list = list.filter(r => r.date >= today);
  if (activeMonth  !== '전체') list = list.filter(r => r.date.slice(0,7) === activeMonth);
  if (activeRegion !== '전체') list = list.filter(r => r.region === activeRegion);
  if (activeStatus !== '전체') list = list.filter(r => STATUS_KR[r.status] === activeStatus);
  if (activeDist   !== '전체') {
    list = list.filter(r => r.distances.some(d => {
      if (activeDist === '울트라') return ['100km','50km','울트라'].includes(d);
      return d === activeDist;
    }));
  }
  // 텍스트 검색 (대회명 + 장소 + 주관사)
  if (activeSearch) {
    const kw = activeSearch.toLowerCase();
    list = list.filter(r =>
      (r.name      || '').toLowerCase().includes(kw) ||
      (r.location  || '').toLowerCase().includes(kw) ||
      (r.organizer || '').toLowerCase().includes(kw)
    );
    document.getElementById('search-clear').style.display = '';
  } else {
    document.getElementById('search-clear').style.display = 'none';
  }
  const sort = document.getElementById('sort-select').value;
  list.sort((a, b) => sort === 'date' ? a.date.localeCompare(b.date) : a.name.localeCompare(b.name));

  document.getElementById('count').textContent = list.length;
  const container = document.getElementById('race-list');
  const empty     = document.getElementById('empty-state');
  if (!list.length) { container.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  container.innerHTML = list.map(r => {
    const [y, mo, d] = r.date.split('-').map(Number);
    const isIntl = r.type === 'intl';
    const dday   = getDday(r.date);
    const badges = r.distances.map(d2 =>
      `<span class="badge ${DIST_CLS[d2] || 'b-other'}">${d2}</span>`
    ).join('');
    const naverUrl = `https://search.naver.com/search.naver?query=${encodeURIComponent(r.name)}`;

    return `
      <div class="race-card" onclick="window.open('${naverUrl}','_blank')">
        <div class="race-date${isIntl ? ' intl' : ''}">
          <span class="rd-month">${mo}월</span>
          <span class="rd-day">${d}</span>
          <span class="rd-week">(${r.weekday})</span>
          <span class="dday-badge ${dday.cls}">${dday.label}</span>
        </div>
        <div class="race-body">
          <div class="race-badges">${badges}</div>
          <div class="race-name">${r.name}</div>
          <div class="race-meta">
            <span>${r.location}</span>
            ${r.startTime ? `<span>${r.startTime} 출발</span>` : ''}
          </div>
        </div>
        <div class="race-right">
          <span class="status-badge ${STATUS_CLS[r.status]}">${STATUS_KR[r.status]}</span>
          <div class="reg-period">${r.regStart ? `접수 ${r.regStart}<br>~ ${r.regEnd}` : ''}</div>
        </div>
      </div>`;
  }).join('');
}

// ════════════════════════════════
//  부트스트랩
// ════════════════════════════════
(async function boot() {
  document.getElementById('race-list').innerHTML =
    '<div style="text-align:center;padding:48px;color:var(--text-muted)">⏳ 불러오는 중...</div>';
  try {
    const res = await fetch('races.json?v=' + Date.now());
    if (!res.ok) throw new Error('races.json ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) throw new Error('빈 데이터');
    RACES.length = 0;
    data.forEach(r => RACES.push(r));
    console.log('[JOYFULRUN] 로드 완료:', data.length, '건');
  } catch(e) {
    console.warn('[JOYFULRUN] races.json 실패 → 샘플 데이터:', e.message);
  }
  updateStats();
  buildFilters();
  renderRaces();
})();

</script>
