<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🏃 RunInfo — 마라톤 대회 정보</title>
  <style>
    /* ── CSS 변수 (라이트) ── */
    :root {
      --primary:        #e84057;
      --primary-dark:   #c42d42;
      --primary-light:  #ffeaed;
      --secondary:      #3b5bdb;
      --secondary-light:#edf2ff;
      --accent:         #ff922b;
      --bg:             #f8f9fa;
      --card-bg:        #ffffff;
      --text:           #212529;
      --text-muted:     #868e96;
      --border:         #dee2e6;
      --header-bg:      #ffffff;
      --radius:         12px;
    }
    /* ── CSS 변수 (다크) ── */
    [data-theme="dark"] {
      --bg:             #141416;
      --card-bg:        #1e1e22;
      --text:           #e9ecef;
      --text-muted:     #868e96;
      --border:         #2e2e36;
      --header-bg:      #1a1a1f;
      --primary-light:  rgba(232,64,87,0.18);
      --secondary-light:rgba(59,91,219,0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', -apple-system, 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background .3s, color .3s;
    }

    /* ── HEADER ── */
    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: background .3s, border-color .3s;
    }
    .header-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; height: 60px;
    }
    .logo {
      font-size: 1.45rem; font-weight: 800; color: var(--primary);
      text-decoration: none; letter-spacing: -0.5px;
    }
    nav { display: flex; align-items: center; gap: 4px; }
    nav a {
      text-decoration: none; color: var(--text-muted);
      font-size: 0.9rem; font-weight: 500;
      padding: 6px 14px; border-radius: 20px; transition: all .2s; cursor: pointer;
    }
    nav a:hover, nav a.active { color: var(--primary); background: var(--primary-light); }

    /* ── 다크모드 토글 버튼 ── */
    .dark-toggle {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all .2s;
      white-space: nowrap;
    }
    .dark-toggle:hover { border-color: var(--primary); color: var(--primary); }
    [data-theme="dark"] .dark-toggle { border-color: #555; }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(135deg, var(--primary) 0%, #ff6b8a 60%, var(--accent) 100%);
      color: #fff; text-align: center; padding: 48px 20px 40px;
    }
    .hero h1 { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
    .hero p  { font-size: 1rem; opacity: .85; }
    .hero-stats { display: flex; justify-content: center; gap: 36px; margin-top: 24px; }
    .hero-stat strong { display: block; font-size: 1.6rem; font-weight: 800; }
    .hero-stat span   { font-size: 0.78rem; opacity: .85; }

    /* ── TABS ── */
    .tab-bar {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      transition: background .3s;
    }
    .tab-inner { max-width: 1100px; margin: 0 auto; display: flex; padding: 0 20px; }
    .tab-btn {
      padding: 14px 28px; font-size: 0.95rem; font-weight: 600;
      color: var(--text-muted); border: none; background: none;
      cursor: pointer; border-bottom: 3px solid transparent; transition: all .2s;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* ── FILTERS ── */
    .filters-wrap {
      background: var(--header-bg); border-bottom: 1px solid var(--border);
      padding: 14px 0; transition: background .3s;
    }
    .filters-inner {
      max-width: 1100px; margin: 0 auto; padding: 0 20px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .filter-row   { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .filter-label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); width: 36px; flex-shrink: 0; }
    .chip {
      padding: 5px 14px; border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--card-bg); color: var(--text);
      font-size: 0.82rem; font-weight: 500;
      cursor: pointer; transition: all .18s;
    }
    .chip:hover                { border-color: var(--primary); color: var(--primary); }
    .chip.active               { background: var(--primary);   color: #fff; border-color: var(--primary); }
    .chip.region-chip.active   { background: var(--secondary); color: #fff; border-color: var(--secondary); }
    .chip.dist-chip.active     { background: var(--accent);    color: #fff; border-color: var(--accent); }

    /* ── CONTENT ── */
    .content { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
    .content-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .result-count strong { color: var(--primary); }
    .sort-select {
      border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 12px; font-size: 0.85rem; cursor: pointer;
      background: var(--card-bg); color: var(--text); transition: background .3s;
    }

    /* ── RACE CARDS ── */
    .race-list { display: flex; flex-direction: column; gap: 12px; }
    .race-card {
      background: var(--card-bg); border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex; align-items: stretch; overflow: hidden;
      cursor: pointer; transition: box-shadow .2s, transform .2s, border-color .2s;
    }
    .race-card:hover {
      box-shadow: 0 6px 24px rgba(0,0,0,.12);
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    /* 날짜 컬럼 */
    .race-date {
      width: 90px; min-width: 90px;
      background: var(--primary-light);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 14px 8px; text-align: center;
      gap: 2px;
    }
    .race-date.intl { background: var(--secondary-light); }

    .rd-month  { font-size: 0.75rem; font-weight: 700; color: var(--primary); }
    .rd-day    { font-size: 1.9rem;  font-weight: 900; color: var(--primary); line-height: 1; }
    .rd-week   { font-size: 0.72rem; color: var(--primary); }
    .race-date.intl .rd-month,
    .race-date.intl .rd-day,
    .race-date.intl .rd-week { color: var(--secondary); }

    /* D-day 배지 */
    .dday-badge {
      margin-top: 6px;
      font-size: 0.68rem; font-weight: 800;
      padding: 3px 7px; border-radius: 8px;
      display: inline-block;
    }
    .dday-today  { background: var(--primary);  color: #fff; }
    .dday-soon   { background: var(--primary);  color: #fff; }
    .dday-mid    { background: var(--accent);   color: #fff; }
    .dday-far    { background: var(--secondary);color: #fff; }
    .dday-past   { background: #adb5bd;         color: #fff; }

    /* 본문 컬럼 */
    .race-body  { flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 5px; }
    .race-badges{ display: flex; gap: 5px; flex-wrap: wrap; }
    .badge      { font-size: 0.72rem; font-weight: 700; padding: 2px 9px; border-radius: 10px; }
    .b-full  { background: #ffe3e3; color: #c92a2a; }
    .b-half  { background: #fff3bf; color: #e67700; }
    .b-10k   { background: #d3f9d8; color: #2f9e44; }
    .b-5k    { background: #e8f4fd; color: #1971c2; }
    .b-ultra { background: #f3d9fa; color: #7950f2; }
    .b-other { background: #f1f3f5; color: #495057; }
    [data-theme="dark"] .b-full  { background: rgba(201,42,42,.25);   color: #ff8787; }
    [data-theme="dark"] .b-half  { background: rgba(230,119,0,.25);   color: #ffd43b; }
    [data-theme="dark"] .b-10k   { background: rgba(47,158,68,.25);   color: #8ce99a; }
    [data-theme="dark"] .b-5k    { background: rgba(25,113,194,.25);  color: #74c0fc; }
    [data-theme="dark"] .b-ultra { background: rgba(121,80,242,.25);  color: #d0bfff; }
    [data-theme="dark"] .b-other { background: rgba(73,80,87,.3);     color: #ced4da; }

    .race-name { font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
    .race-meta {
      font-size: 0.82rem; color: var(--text-muted);
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }

    /* 오른쪽 컬럼 */
    .race-right {
      display: flex; flex-direction: column;
      align-items: flex-end; justify-content: center;
      padding: 14px 16px; gap: 8px; min-width: 160px;
    }
    .status-badge { font-size: 0.78rem; font-weight: 700; padding: 4px 13px; border-radius: 20px; }
    .s-open     { background: #d3f9d8; color: #2f9e44; }
    .s-upcoming { background: #fff3bf; color: #e67700; }
    .s-closed   { background: #f1f3f5; color: #868e96; }
    [data-theme="dark"] .s-open     { background: rgba(47,158,68,.2);  color: #8ce99a; }
    [data-theme="dark"] .s-upcoming { background: rgba(230,119,0,.2);  color: #ffd43b; }
    [data-theme="dark"] .s-closed   { background: rgba(134,142,150,.15); color: #868e96; }
    .reg-period { font-size: 0.75rem; color: var(--text-muted); text-align: right; line-height: 1.5; }

    /* ── EMPTY STATE ── */
    .empty-state { text-align: center; padding: 64px 20px; color: var(--text-muted); display: none; }
    .empty-state p { margin-top: 10px; }

    /* ── FOOTER ── */
    footer {
      background: #1a1a1f; color: rgba(255,255,255,.5);
      text-align: center; padding: 28px 20px; margin-top: 48px; font-size: 0.82rem;
    }
    footer strong { color: #fff; }

    @media (max-width: 600px) {
      .hero h1 { font-size: 1.4rem; }
      .hero-stats { gap: 20px; }
      .race-right { display: none; }
      .race-date  { width: 76px; min-width: 76px; }
    }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="header-inner">
    <a class="logo" href="#">🏃 RunInfo</a>
    <nav>
      <a href="#" class="active" id="nav-domestic" onclick="switchTab('domestic'); setNavActive(this)">국내</a>
      <a href="#" id="nav-intl"     onclick="switchTab('intl');     setNavActive(this)">해외</a>
      <button class="dark-toggle" id="dark-toggle-btn" onclick="toggleTheme()">🌙 다크모드</button>
      <a href="#" class="dark-toggle" style="border:none;background:var(--primary);color:#fff;margin-left:4px;">로그인</a>
    </nav>
  </div>
</header>

<!-- ── HERO ── -->
<section class="hero">
  <h1>🏃 마라톤 대회 정보 한눈에</h1>

  </div>
</section>

<!-- ── TAB BAR ── -->
<div class="tab-bar">

</div>

<!-- ── FILTERS ── -->
<div class="filters-wrap">

      <span class="filter-label">거리</span>
      <div id="dist-filter" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
    </div>
  </div>
</div>

<!-- ── CONTENT ── -->
<div class="content">
  <div class="content-header">
    <p class="result-count"><strong id="count">0</strong>개 대회</p>

  <div class="race-list" id="race-list"></div>
  <div class="empty-state" id="empty-state">
    <div style="font-size:2.5rem">🔍</div>
    <p>조건에 맞는 대회가 없습니다.</p>
  </div>
</div>

<footer>

</footer>

// ════════════════════════════════
//  다크모드
// ════════════════════════════════
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('dark-toggle-btn');
  if (btn) btn.innerHTML = theme === 'dark' ? '☀️ 라이트모드' : '🌙 다크모드';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('ri_theme', next); } catch(e) {}
}
// 저장된 테마 적용
try {
  const saved = localStorage.getItem('ri_theme');
  if (saved) applyTheme(saved);
} catch(e) {}

// ════════════════════════════════
//  D-DAY 계산 (타임존 안전)
// ════════════════════════════════
function getDday(dateStr) {
  // "2026-05-09" → 로컬 기준으로 파싱
  const [y, m, d] = dateStr.split('-').map(Number);
  const race  = new Date(y, m - 1, d);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.round((race - today) / 86400000);

  if (diff < 0)   return { label: '종료',   cls: 'dday-past' };
  if (diff === 0) return { label: 'D-DAY',  cls: 'dday-today' };
  if (diff <= 30) return { label: `D-${diff}`, cls: 'dday-soon' };
  if (diff <= 90) return { label: `D-${diff}`, cls: 'dday-mid' };
  return              { label: `D-${diff}`, cls: 'dday-far' };
}

// ════════════════════════════════
//  통계
// ════════════════════════════════
function updateStats() {
  const domestic = RACES.filter(r => r.type === 'domestic').length;
  const intl     = RACES.filter(r => r.type === 'intl').length;
  const open     = RACES.filter(r => r.status === 'open').length;
  countUp('stat-domestic', domestic);
  countUp('stat-intl', intl);
  countUp('stat-open', open);
}
function countUp(id, target) {
  let n = 0;
  const el = document.getElementById(id);
  const iv = setInterval(() => {
    n = Math.min(n + Math.ceil(target / 20), target);
    el.textContent = n;
    if (n >= target) clearInterval(iv);
  }, 40);
}

// ════════════════════════════════
//  네비 활성화
// ════════════════════════════════
function setNavActive(el) {
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  el.classList.add('active');
}

// ════════════════════════════════
//  탭 전환
// ════════════════════════════════
function switchTab(tab) {
  currentTab = tab;
  activeRegion = activeStatus = activeDist = '전체';
  document.getElementById('tab-domestic').classList.toggle('active', tab === 'domestic');
  document.getElementById('tab-intl').classList.toggle('active', tab === 'intl');
  buildFilters();
  renderRaces();
}

// ════════════════════════════════
//  필터 빌드
// ════════════════════════════════
function buildFilters() {
  buildRegion();
  buildStatus();
  buildDist();
}
function buildRegion() {
  const list = currentTab === 'domestic' ? DOMESTIC_REGIONS : INTL_REGIONS;
  const wrap = document.getElementById('region-filter');
  const label = wrap.querySelector('.filter-label');
  wrap.innerHTML = ''; wrap.appendChild(label);
  list.forEach(r => {
    const b = document.createElement('button');
    b.className = 'chip region-chip' + (r === activeRegion ? ' active' : '');
    b.textContent = r;
    b.onclick = () => { activeRegion = r; buildRegion(); renderRaces(); };
    wrap.appendChild(b);
  });
}
function buildStatus() {
  const wrap = document.getElementById('status-filter'); wrap.innerHTML = '';
  STATUSES.forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip' + (s === activeStatus ? ' active' : '');
    b.textContent = s;
    b.onclick = () => { activeStatus = s; buildStatus(); renderRaces(); };
    wrap.appendChild(b);
  });
}
function buildDist() {
  const wrap = document.getElementById('dist-filter'); wrap.innerHTML = '';
  DISTANCES.forEach(d => {
    const b = document.createElement('button');
    b.className = 'chip dist-chip' + (d === activeDist ? ' active' : '');
    b.textContent = d;
    b.onclick = () => { activeDist = d; buildDist(); renderRaces(); };
    wrap.appendChild(b);
  });
}

// ════════════════════════════════
//  렌더
// ════════════════════════════════
function renderRaces() {
  let list = RACES.filter(r => r.type === currentTab);
  if (activeRegion !== '전체') list = list.filter(r => r.region === activeRegion);
  if (activeStatus !== '전체') list = list.filter(r => STATUS_KR[r.status] === activeStatus);
  if (activeDist !== '전체') {
    list = list.filter(r => r.distances.some(d => {
      if (activeDist === '울트라') return ['100km','50km','50K','37K','24K','12K'].includes(d);
      return d === activeDist;
    }));
  }
  const sort = document.getElementById('sort-select').value;
  list.sort((a, b) => sort === 'date' ? a.date.localeCompare(b.date) : a.name.localeCompare(b.name));

  document.getElementById('count').textContent = list.length;
  const container = document.getElementById('race-list');
  const empty     = document.getElementById('empty-state');

  if (!list.length) { container.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  container.innerHTML = list.map(r => {
    const [y, mo, d] = r.date.split('-').map(Number);
    const isIntl = r.type === 'intl';
    const dday   = getDday(r.date);
    const badges = r.distances.map(d2 =>
      `<span class="badge ${DIST_CLS[d2] || 'b-other'}">${d2}</span>`
    ).join('');

    return `
      <div class="race-card" onclick="window.open('${r.url}','_blank')">
        <div class="race-date${isIntl ? ' intl' : ''}">
          <span class="rd-month">${mo}월</span>
          <span class="rd-day">${d}일</span>
          <span class="rd-week">(${r.weekday})</span>
          <span class="dday-badge ${dday.cls}">${dday.label}</span>
        </div>
        <div class="race-body">
          <div class="race-badges">${badges}</div>
          <div class="race-name">${r.name}</div>
          <div class="race-meta">
            <span>${isIntl ? '🌏' : '📍'} ${r.location}</span>
            <span>⏰ ${r.startTime} 출발</span>
          </div>
        </div>
        <div class="race-right">
          <span class="status-badge ${STATUS_CLS[r.status]}">${STATUS_KR[r.status]}</span>
          <div class="reg-period">접수 ${r.regStart}<br>~ ${r.regEnd}</div>
        </div>
      </div>`;
  }).join('');
}

// ════════════════════════════════
//  부트스트랩 — races.json 로드
// ════════════════════════════════
(async function boot() {
  document.getElementById('race-list').innerHTML =
    '<div style="text-align:center;padding:48px;color:var(--text-muted)">⏳ 불러오는 중...</div>';
  try {
    const res = await fetch('races.json?v=' + Date.now());
    if (!res.ok) throw new Error('races.json ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) throw new Error('빈 데이터');
    RACES.length = 0;
    data.forEach(r => RACES.push(r));
    console.log('[RunInfo] races.json 로드 완료:', data.length, '건');
  } catch(e) {
    console.warn('[RunInfo] races.json 로드 실패 → 샘플 데이터 사용:', e.message);
  }
  updateStats();
  buildFilters();
  renderRaces();
})();
</script>
