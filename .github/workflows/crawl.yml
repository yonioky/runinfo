name: 🏃 마라톤 데이터 자동 수집

on:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 오전 9시 KST
  workflow_dispatch:        # 수동 실행

jobs:
  crawl-and-update:
    name: 크롤링 & races.json 갱신
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # cache 옵션 제거 — requirements.txt 불필요

      - name: 📦 라이브러리 설치
        run: |
          pip install requests beautifulsoup4 lxml playwright

      - name: 🌐 Playwright Chromium 설치
        run: playwright install chromium --with-deps

      - name: 🕷️ 크롤러 실행
        run: python crawler.py

      - name: 🧩 index.html 정적 대회목록 갱신 (프리렌더)
        run: python prerender.py

      - name: 💾 races.json & index.html 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add races.json index.html
          git diff --cached --quiet || git commit -m "chore: 마라톤 데이터 자동 갱신 $(date +'%Y-%m-%d')"
          git push
